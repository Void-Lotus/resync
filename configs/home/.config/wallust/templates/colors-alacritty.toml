# Wallust template - colors for Alacritty
[colors.primary]
background = '#000000'
foreground = '{{foreground}}'

[colors.cursor]
text = '#000000'
cursor = '{{cursor}}'

[colors.selection]
text = '{{foreground}}'
background = '{{color4}}'

[colors.normal]
black   = '{{color0}}'
red     = '{{color1}}'
green   = '{{color2}}'
yellow  = '{{color3}}'
blue    = '{{color4}}'
magenta = '{{color5}}'
cyan    = '{{color6}}'
white   = '{{color7}}'

[colors.bright]
black   = '{{color8}}'
red     = '{{color9}}'
green   = '{{color10}}'
yellow  = '{{color11}}'
blue    = '{{color12}}'
magenta = '{{color13}}'
cyan    = '{{color14}}'
white   = '{{color15}}'

[colors.dim]
black   = '{{color0}}'
red     = '{{color1}}'
green   = '{{color2}}'
yellow  = '{{color3}}'
blue    = '{{color4}}'
magenta = '{{color5}}'
cyan    = '{{color6}}'
white   = '{{color7}}'

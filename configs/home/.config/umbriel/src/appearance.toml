[appearance]
animation_ms = 300
backdrop_color = '#00000080'
border_width = 4
corner_radius = 10
outer_border_width = 0

    [appearance.blur]
    enabled = true
    optimized = true
    passes = 4
    radius = 7
    noise = 0.02
    brightness = 0.90
    contrast = 0.90
    saturation = 1.15

    [appearance.shadow]
    color = '#0000007F'
    enabled = true
    offset_x = 2
    offset_y = 2
    softness = 10

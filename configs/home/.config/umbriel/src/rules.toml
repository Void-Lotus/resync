[[layer_rule]]
match.namespace = '^noctalia-(notification|dock|panel|attached-panel|osd|desktop-widget-.*|launcher)$'
blur = true
blur_ignore_alpha = 0.15
blur_popups = true

[[layer_rule]]
match.namespace = '^noctalia-bar-.*$'
blur = false

[[window_rule]]
match.app_id = '^(Alacritty|kitty|ghostty|foot|code|org\.gnome\.Nautilus)$'
blur = true
blur_popups = true
blur_ignore_alpha = 0.0

[[window_rule]]
match.app_id = '^dev.noctalia.Noctalia$'
default_floating = true
blur_popups = false

[[window_rule]]
match.app_id = '^dev.noctalia.UmbrielSharePicker$'
default_floating = true

[[window_rule]]
match.is_focused = false
opacity = 0.55

[[window_rule]]
match.is_focused = true
opacity = 1.0
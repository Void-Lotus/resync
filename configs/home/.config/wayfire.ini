[alpha]
min_value = 0.100000
modifier = <alt> <super>

[animate]
close_animation = zoom
duration = 300
enabled_for = (type equals "toplevel" | (type equals "x-or" & focusable equals true) | type equals "overlay")
fade_duration = 250
fade_enabled_for = type equals "overlay" | title is toplevel
fire_duration = 300
fire_enabled_for = none
fire_particle_size = 16.000000
fire_particles = 2000
open_animation = zoom
startup_duration = 400
zoom_duration = 300
zoom_enabled_for = none

[annotate]
clear_workspace = <alt> <super> KEY_C
draw = <alt> <super> BTN_LEFT
from_center = true
line_width = 3.000000
method = draw
stroke_color = #FF0000FF

[autorotate-iio]
lock_rotation = false
rotate_down = none
rotate_left = none
rotate_right = none
rotate_up = none

[autostart]
autostart_wf_shell = false
noctalia = noctalia
clipman-restore = clipman restore
clipman-store = wl-paste -t text --watch clipman store
dex = dex -a -s /etc/xdg/autostart/:~/.config/autostart/
gnome-keyring = gnome-keyring-daemon --daemonize --start --components=gpg,pkcs11,secrets,ssh
idle = swayidle before-sleep swaylock
libinput-gesture = libinput-gestures-setup start
nm = nm-applet --indicator
outputs = kanshi
polkit-gnome = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
portal = /usr/libexec/xdg-desktop-portal
gammastep = gammastep
tracker = tracker daemon -s

[background-view]
command = mpv --loop=inf
file =

[bench]
average_frames = 1
frames_per_update = 3
position = top_center

[blur]
blur_by_default = type is "toplevel"
bokeh_degrade = 1
bokeh_iterations = 15
bokeh_offset = 5.000000
box_degrade = 1
box_iterations = 2
box_offset = 2.000000
gaussian_degrade = 1
gaussian_iterations = 2
gaussian_offset = 2.000000
kawase_degrade = 1
kawase_iterations = 3
kawase_offset = 3.000000
method = kawase
mode = normal
saturation = 1.100000
toggle = none

[command]
binding_reload = <super> <shift> KEY_R
command_reload = touch ~/.config/wayfire.ini && notify-send -i "preferences-system" "Wayfire" "Configuration reloaded"

binding_terminal = <super> KEY_ENTER
command_terminal = alacritty

binding_thunar = <super> <shift> KEY_ENTER
command_thunar = thunar

binding_launcher = <super> KEY_SPACE | <super> KEY_D
command_launcher = noctalia msg panel-toggle launcher

binding_control_center = <super> KEY_N | <super> <shift> KEY_S
command_control_center = noctalia msg panel-toggle control-center

binding_settings = <super> KEY_I | <super> KEY_S
command_settings = noctalia msg settings-toggle

binding_assistant = <super> KEY_A
command_assistant = noctalia msg panel-toggle assistant-panel

binding_clipman = <super> KEY_V
command_clipman = clipman pick -t wofi

binding_browser_firefox = <super> KEY_B
command_browser_firefox = firefox

binding_browser_zen = <super> KEY_W
command_browser_zen = zen-browser

binding_browser_chrome = <super> <shift> KEY_W
command_browser_chrome = google-chrome

binding_nautilus = <super> KEY_E
command_nautilus = nautilus

binding_antigravity = <super> KEY_C
command_antigravity = alacritty -e agy

binding_joplin = <super> <shift> KEY_J
command_joplin = alacritty -e joplin

binding_cheatsheet_arch = <super> <shift> KEY_H
command_cheatsheet_arch = alacritty --class arch-cheatsheet -e micro /home/voidlotus/.config/niri/cfg/nixos-cheatsheet.txt

binding_screenshot = KEY_PRINT | <ctrl> <shift> KEY_1
command_screenshot = grim $HOME/Pictures/screenshot-$(date "+%Y-%m-%d-%H-%M-%S").png && notify-send -i "camera" 'Screenshot' 'Saved in ~/Pictures'

binding_screenshot_interactive = <super> <shift> KEY_P | <ctrl> <shift> KEY_2
command_screenshot_interactive = slurp | grim -g - $HOME/Pictures/screenshot-$(date "+%Y-%m-%d-%H-%M-%S").png && notify-send -i "camera" 'Selection Screenshot' 'Saved in ~/Pictures'

binding_lock = <super> <shift> KEY_L | <ctrl> <alt> KEY_L | <alt> <super> KEY_L
command_lock = noctalia msg session lock

binding_logout = <super> KEY_ESC | <super> <shift> KEY_Q
command_logout = noctalia msg panel-toggle session

binding_media-play-pause = KEY_PLAYPAUSE
command_media-play-pause = playerctl play-pause

binding_media-stop = KEY_STOPCD
command_media-stop = playerctl stop

binding_media-next = KEY_NEXTSONG
command_media-next = playerctl next

binding_media-prev = KEY_PREVIOUSSONG
command_media-prev = playerctl previous

binding_mute = KEY_MUTE
command_mute = amixer sset Master toggle

repeatable_binding_brightness_down = KEY_BRIGHTNESSDOWN
command_brightness_down = brightnessctl s 5%-

repeatable_binding_brightness_up = KEY_BRIGHTNESSUP
command_brightness_up = brightnessctl s +5%

repeatable_binding_volume_down = KEY_VOLUMEDOWN
command_volume_down = noctalia msg volume-down

repeatable_binding_volume_up = KEY_VOLUMEUP
command_volume_up = noctalia msg volume-up

[core]
background_color = #1A1A1AFF
close_top_view = <super> KEY_Q | <alt> KEY_F4
focus_button_with_modifiers = false
focus_buttons = BTN_LEFT | BTN_MIDDLE | BTN_RIGHT
focus_buttons_passthrough = true
max_render_time = -1
plugins = alpha animate autostart blur command cube decoration expo fast-switcher grid idle move oswitch place resize simple-tile switcher vswitch water window-rules winshadows wobbly wrot zoom wm-actions scale vswipe annotate
preferred_decoration_mode = server
vheight = 3
vwidth = 3
xwayland = true

[cube]
activate = <ctrl> <alt> BTN_LEFT
background = #1A1A1AFF
background_mode = simple
cubemap_image =
deform = 0
initial_animation = 350
light = true
rotate_left = <ctrl> <super> KEY_LEFT
rotate_right = <ctrl> <super> KEY_RIGHT
skydome_mirror = true
skydome_texture =
speed_spin_horiz = 0.020000
speed_spin_vert = 0.020000
speed_zoom = 0.070000
zoom = 0.100000

[decoration]
active_color = #00F2FFFF
inactive_color = #1A1B26BB
border_size = 4
button_order = minimize maximize close
font = Fira Sans
ignore_views = none
title_height = 0

[pixdecor]
always_decorate = type equals "toplevel"
animate = false
bg_color = 0.10 0.11 0.15 0.6
border_size = 6
effect_color = 1.0 0.0 0.9 1.0
effect_type = none
fg_color = 0.0 0.95 1.0 1.0
fg_text_color = 1.0 1.0 1.0 1.0
bg_text_color = 0.7 0.7 0.7 1.0
ignore_views = none
maximized_borders = true
maximized_shadows = false
overlay_engine = rounded_corners
rounded_corner_radius = 8
shadow_color = 0.0 0.95 1.0 0.6
shadow_radius = 16
titlebar = true

[expo]
background = #1A1A1AFF
duration = 300
offset = 5
select_workspace_1 = KEY_1
select_workspace_2 = KEY_2
select_workspace_3 = KEY_3
select_workspace_4 = KEY_4
select_workspace_5 = KEY_5
select_workspace_6 = KEY_6
select_workspace_7 = KEY_7
select_workspace_8 = KEY_8
select_workspace_9 = KEY_9
toggle = <super>

[extra-gestures]
close_fingers = 20
move_delay = 500
move_fingers = 3

[fast-switcher]
activate = <alt> KEY_ESC
activate_backward = <alt> <shift> KEY_ESC
inactive_alpha = 0.700000

[fisheye]
radius = 450.000000
toggle = <ctrl> <super> BTN_LEFT
zoom = 7.000000

[follow-focus]
change_output = true
change_view = true
focus_delay = 50
raise_on_top = true
threshold = 10

[force-fullscreen]
constrain_pointer = false
constraint_area = view
key_toggle_fullscreen = <alt> <super> KEY_F
preserve_aspect = true
transparent_behind_views = true
x_skew = 0.000000
y_skew = 0.000000

[grid]
duration = 300
restore = <super> KEY_DOWN | <super> KEY_KP0
slot_b = <super> KEY_DOWN | <super> KEY_KP2
slot_bl = <super> KEY_KP1
slot_br = <super> KEY_KP3
slot_c = <super> KEY_UP | <super> KEY_KP5
slot_l = <super> KEY_LEFT | <super> KEY_KP4
slot_r = <super> KEY_RIGHT | <super> KEY_KP6
slot_t = <super> KEY_UP | <super> KEY_KP8
slot_tl = <super> KEY_KP7
slot_tr = <super> KEY_KP9
type = crossfade

[idle]
cube_max_zoom = 1.500000
cube_rotate_speed = 1.000000
cube_zoom_speed = 1000
disable_on_fullscreen = true
dpms_timeout = -1
screensaver_timeout = 3600
toggle = none

[input]
click_method = default
cursor_size = 24
cursor_theme = capitaine-cursors
disable_touchpad_while_mouse = false
disable_touchpad_while_typing = false
gesture_sensitivity = 1.000000
kb_capslock_default_state = false
kb_numlock_default_state = false
kb_repeat_delay = 400
kb_repeat_rate = 40
middle_emulation = false
modifier_binding_timeout = 400
mouse_accel_profile = default
mouse_cursor_speed = 0.000000
mouse_scroll_speed = 1.000000
natural_scroll = false
scroll_method = default
tap_to_click = true
touchpad_accel_profile = default
touchpad_cursor_speed = 0.000000
touchpad_scroll_speed = 1.000000
xkb_layout = us,ru
xkb_model =
xkb_options = grp:caps_toggle,grp_led:caps,ctrl:rctrl_ralt
xkb_rules = evdev
xkb_variant =

[input-device]
output =

[invert]
preserve_hue = false
toggle = <super> KEY_I

[join-views]

[keycolor]
color = #000000FF
opacity = 0.250000
threshold = 0.500000

[mag]
default_height = 500
toggle = <alt> <super> KEY_M
zoom_level = 75

[move]
activate = <super> BTN_LEFT
enable_snap = true
enable_snap_off = true
join_views = false
quarter_snap_threshold = 50
snap_off_threshold = 10
snap_threshold = 10
workspace_switch_after = -1

[oswitch]
next_output = <super> KEY_O
next_output_with_win = <shift> <super> KEY_O

[output]
mode = auto
position = auto
scale = 1.000000
transform = normal

[place]
mode = random

[preserve-output]
last_output_focus_timeout = 10000

[resize]
activate = <super> BTN_RIGHT

[scale]
allow_zoom = false
bg_color = #1A1A1AE6
duration = 400
inactive_alpha = 0.750000
interact = true
middle_click_close = true
spacing = 50
text_color = #CCCCCCFF
title_font_size = 12
title_overlay = all
title_position = center
toggle = <super> KEY_P | hotspot left-top 10x100 100
toggle_all = <super> <shift> KEY_P

[scale-title-filter]
bg_color = #00000080
case_sensitive = false
font_size = 30
overlay = true
share_filter = false
text_color = #CCCCCCCC

[simple-tile]
button_move = <super> BTN_LEFT
button_resize = <super> BTN_RIGHT
inner_gap_size = 8
keep_fullscreen_on_adjacent = true
key_focus_above = <super> KEY_K
key_focus_below = <super> KEY_J
key_focus_left = <super> KEY_H
key_focus_right = <super> KEY_L
key_toggle = <super> KEY_T
outer_horiz_gap_size = 8
outer_vert_gap_size = 8
tile_by_default = type equals "toplevel"

[switcher]
gesture_toggle = edge-swipe down 3
next_view = <alt> KEY_TAB
prev_view = <alt> <shift> KEY_TAB
speed = 500
touch_sensitivity = 1.000000
view_thumbnail_scale = 1.000000

[vswipe]
background = #1A1A1AFF
delta_threshold = 24.000000
duration = 180
enable_free_movement = true
enable_horizontal = true
enable_smooth_transition = true
enable_vertical = true
fingers = 4
gap = 32.000000
speed_cap = 0.050000
speed_factor = 256.000000
threshold = 0.350000

[vswitch]
background = #1A1A1AFF
binding_down = <ctrl> <super> KEY_DOWN
binding_left = <ctrl> <super> KEY_LEFT
binding_right = <ctrl> <super> KEY_RIGHT
binding_up = <ctrl> <super> KEY_UP
binding_win_down = <ctrl> <shift> <super> KEY_DOWN
binding_win_left = <ctrl> <shift> <super> KEY_LEFT
binding_win_right = <ctrl> <shift> <super> KEY_RIGHT
binding_win_up = <ctrl> <shift> <super> KEY_UP
duration = 300
gap = 20
wraparound = false

[water]
activate = <ctrl> <super> BTN_LEFT

[window-rules]

[winshadows]
clip_shadow_inside = true
enabled_for = type equals "toplevel"
include_undecorated_views = true
shadow_color = #00F2FFB0
shadow_radius = 20

[winzoom]
dec_x_binding = none
dec_y_binding = none
inc_x_binding = none
inc_y_binding = none
modifier = <ctrl> <super>
nearest_filtering = false
preserve_aspect = true
zoom_step = 0.100000

[wm-actions]
minimize = <super> KEY_MINUS
send_to_back = none
toggle_always_on_top = <super> KEY_A
toggle_fullscreen = <super> KEY_F
toggle_maximize = <super> KEY_M
toggle_showdesktop = <super> KEY_F11
toggle_sticky = none

[wobbly]
friction = 3.000000
grid_resolution = 6
spring_k = 8.000000

[workarounds]
all_dialogs_modal = true
app_id_mode = stock
dynamic_repaint_delay = false

[workspace-names]
background_color = #1A1B26CC
display_duration = 600
font = Fira Sans
position = center
show_option_names = false
text_color = #FFFFFFFF

[wrot]
activate = <ctrl> <super> BTN_RIGHT
activate-3d = <shift> <super> BTN_RIGHT
invert = false
reset = <ctrl> <super> KEY_R
reset-one = <super> KEY_R
reset_radius = 25.000000
sensitivity = 24

[zoom]
modifier = <super>
smoothing_duration = 300
speed = 0.010000
